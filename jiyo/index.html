<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4eee5">
    <title>A Little Note For You</title>
    <meta name="description" content="Open a little envelope and find a note made just for you.">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <p class="wordmark">A small thing, with love</p>
        <button class="music-button" id="music-toggle" type="button" aria-pressed="false">
          <span class="music-icon" aria-hidden="true">&#9835;</span>
          <span id="music-label">Play music</span>
        </button>
      </header>

      <main>
        <section class="greeting" aria-labelledby="page-title">
          <p class="eyebrow">Just for you</p>
          <h1 id="page-title">A little note,<br>with a lot of love.</h1>
          <p class="invitation">There is something waiting inside.</p>

          <div class="envelope-scene" id="envelope-scene">
            <article class="letter" id="letter" aria-hidden="true">
              <p class="letter__salutation">Dear you,</p>
              <p class="letter__message">The world is a little brighter with you in it. I hope today brings you a reason to smile.</p>
              <p class="letter__signoff">With love, always</p>
            </article>
            <button class="envelope-button" id="envelope-toggle" type="button" aria-label="Open the envelope" aria-expanded="false" aria-controls="letter">
              <span class="envelope__back" aria-hidden="true"></span>
              <span class="envelope__pocket" aria-hidden="true"></span>
              <span class="envelope__flap" aria-hidden="true"></span>
              <span class="envelope__seal" aria-hidden="true">&#10084;</span>
            </button>
          </div>
          <p class="hint" id="envelope-hint">Tap the envelope to open your note</p>
        </section>
      </main>

      <footer>
        <p class="footer-note">A quiet moment, made for you</p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
